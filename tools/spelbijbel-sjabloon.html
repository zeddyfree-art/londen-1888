<title>Spelbijbel Londen 1888</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: tabbed reference book; the board is an SVG street map with the Thames as a band; cards in wrapping grids. */
:root{
  --bg:#e9eeec; --paper:#f6f8f7; --ink:#18242a; --muted:#56656b; --line:#c3cfcc;
  --accent:#23705f; --accent-ink:#fff; --seal:#8a3b2c; --tint:#dbe7e3; --river:#9fb9c2; --road:#8a9a9c; --rift:#7b3fa0;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --letter:"IM Fell English","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1416; --paper:#142024; --ink:#dde7e4; --muted:#93a5a3; --line:#2a3b3f;
  --accent:#5fbfa6; --accent-ink:#08201a; --seal:#d98a72; --tint:#1b2e30; --river:#1f4450; --road:#4d6266; --rift:#c08ae0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1416; --paper:#142024; --ink:#dde7e4; --muted:#93a5a3; --line:#2a3b3f;
  --accent:#5fbfa6; --accent-ink:#08201a; --seal:#d98a72; --tint:#1b2e30; --river:#1f4450; --road:#4d6266; --rift:#c08ae0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(30px,5vw,44px)}
h2{font-size:26px} h3{font-size:20px}
header p{margin:6px 0 0;color:var(--muted);max-width:70ch}
nav{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 14.5px var(--body);padding:7px 13px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:16px}
.boardwrap{background:var(--paper);border:1px solid var(--line);overflow-x:auto}
svg.board{display:block;width:100%;min-width:680px;height:auto}
.board text{font-family:var(--display);fill:var(--ink)}
.board .svc{font-family:var(--body);font-size:12px;fill:var(--muted)}
.board .node{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.board .node.river{stroke:var(--accent)}
.board .node.sel{fill:var(--accent)}
.board .edge{stroke:var(--road);stroke-width:3;stroke-linecap:round}
.board g.loc{cursor:pointer}
.info{background:var(--paper);border:1px solid var(--line);padding:14px 16px;display:grid;gap:4px}
.info .muted{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block;background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0}
.story{font-family:var(--letter);font-size:16.5px}
.nums{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}
.nums b{font-size:18px}
.cost{font-size:14px;color:var(--seal);font-weight:500}
.god{background:var(--paper);border:1px solid var(--line);padding:18px;display:grid;gap:10px}
.god .title{font-family:var(--letter);font-style:italic;color:var(--muted);font-size:18px}
.god ol{margin:0;padding-left:20px;display:grid;gap:4px}
.rules{background:var(--paper);border:1px solid var(--line);padding:clamp(16px,3vw,32px);max-width:820px}
.rules h2{margin-top:22px} .rules h2:first-child{margin-top:0}
.rules h3{margin-top:14px}
.rules p,.rules li{max-width:68ch}
.rules table{border-collapse:collapse;font-size:15px;margin-top:6px}
.rules td,.rules th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tablewrap{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13.5px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
<div class="wrap">
  <header>
    <h1>Spelbijbel: Londen, 1888</h1>
    <p>Het bord, de regels en alle kaarten van ons eigen spel. Tik op een plek op de kaart om de dienst en de sfeer te zien.</p>
  </header>
  <nav id="tabs" role="tablist" aria-label="Onderdelen"></nav>
  <main id="main"></main>
</div>
<script>
const D = __DATA__;
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS = [["bord","Het bord"],["regels","Spelregels"],["goden","Oude goden"],["monsters","Monsters"],["spreuken","Spreuken"],["spullen","Spullen"],["artefacten","Artefacten"],["toestanden","Toestanden"],["onheil","Onheilskaarten"]];
let tab = (location.hash||"").slice(1); if (!TABS.some(t=>t[0]===tab)) tab = "bord";
let sel = "bloomsbury", sfilter = null;

function md(src){
  const out=[]; let list=null, table=null;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const flush=()=>{ if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${i}</li>`).join("")}</${list.t}>`);list=null}
    if(table){out.push(`<div class="tablewrap"><table>${table.map((r,i)=>`<tr>${r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table></div>`);table=null} };
  for(const line of src.split("\n")){
    let m;
    if(/^\|/.test(line)){ if(/^\|[-| ]+\|$/.test(line)) continue; (table??=[]).push(line.slice(1,-1).split("|").map(s=>s.trim())); continue; }
    if((m=line.match(/^(#{1,3}) (.*)/))){flush(); const l=Math.min(m[1].length+1,3); if(m[1].length===1) continue; out.push(`<h${l}>${inline(m[2])}</h${l}>`); continue;}
    if((m=line.match(/^\s*- (.*)/))){ if(!list||list.t!=="ul"){flush();list={t:"ul",items:[]}} list.items.push(inline(m[1])); continue;}
    if((m=line.match(/^\d+\. (.*)/))){ if(!list||list.t!=="ol"){flush();list={t:"ol",items:[]}} list.items.push(inline(m[1])); continue;}
    if(/^\s+- /.test(line)) continue;
    if(!line.trim()){flush();continue;}
    flush(); out.push(`<p>${inline(line)}</p>`);
  }
  flush(); return out.join("");
}

function board(){
  const b=D.bord, P=Object.fromEntries(b.plekken.map(p=>[p.id,p]));
  const riverPath=b.rivierpad;
  const p=P[sel];
  const starts=D.helden.filter(h=>h.start===p.naam).map(h=>h.naam);
  return `<div class="legend"><span><i class="sw"></i>Plek</span><span><i class="sw" style="border-color:var(--accent)"></i>Aan de rivier</span><span>▣ Station Ondergrondse</span><span>Overzee via St Katharine Docks: ${D.bord.overzee.map(o=>esc(o.naam)).join(", ")}</span></div>
  <div class="boardwrap"><svg class="board" viewBox="0 0 ${b.breedte} ${b.hoogte}" role="img" aria-label="Kaart van Londen met ${b.plekken.length} plekken">
    <path d="${riverPath}" fill="none" stroke="var(--river)" stroke-width="40" opacity=".75" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${b.breedte-170}" y="${b.hoogte-30}" style="font-family:var(--letter);font-style:italic;font-size:22px;fill:var(--muted)">de Theems</text>
    ${b.routes.map(([a,c])=>`<line class="edge" x1="${P[a].x}" y1="${P[a].y}" x2="${P[c].x}" y2="${P[c].y}"/>`).join("")}
    ${b.plekken.map(q=>`<g class="loc" data-loc="${q.id}" tabindex="0" role="button" aria-label="${esc(q.naam)}">
      ${q.ondergronds?`<rect x="${q.x+10}" y="${q.y-24}" width="12" height="12" fill="var(--seal)"/>`:""}
      <circle class="node${q.rivier?" river":""}${q.id===sel?" sel":""}" cx="${q.x}" cy="${q.y}" r="14"/>
      <text x="${q.x}" y="${q.y+34}" text-anchor="middle" font-size="17">${esc(q.naam)}</text>
      <text class="svc" x="${q.x}" y="${q.y+50}" text-anchor="middle">${esc(q.dienst.replace(/-/g," "))}</text></g>`).join("")}
  </svg></div>
  <div class="info"><h3>${esc(p.naam)}</h3><p class="story">${esc(p.sfeer)}</p>
    <p><strong>Dienst (${esc(p.dienst.replace(/-/g," "))}):</strong> ${esc(D.bord.diensten[p.dienst])}</p>
    <p class="muted">Grenst aan: ${b.routes.filter(r=>r.includes(p.id)).map(r=>esc(P[r[0]===p.id?r[1]:r[0]].naam)).join(", ")}${p.rivier?" · aan de rivier":""}${p.ondergronds?" · station van de Ondergrondse":""}</p>
    ${starts.length?`<p class="muted">Startplek van: ${starts.map(esc).join(", ")}</p>`:""}</div>
  <div class="grid">${D.bord.overzee.map(o=>`<div class="card"><span class="kind">Overzee · ${o.kosten} Pond vanaf de dokken</span><h3>${esc(o.naam)}</h3><p class="story">${esc(o.sfeer)}</p></div>`).join("")}</div>`;
}
function goden(){
  const M=Object.fromEntries([...D.monsters,...D.epische].map(m=>[m.id,m]));
  return D.goden.map(g=>`<article class="god"><span class="kind">Mist begint op ${g.mist}</span><h2>${esc(g.naam)}</h2><span class="title">${esc(g.titel)}</span>
    <p class="story">${esc(g.verhaal)}</p><p><strong>Speciale regel:</strong> ${esc(g.regel)}</p><p><strong>Tegenspelers:</strong> ${esc(g.verdachten)}</p>
    <div><strong>Mysteries</strong><ol>${g.mysteries.map(m=>`<li><strong>${esc(m.naam)}.</strong> ${esc(m.doel)}</li>`).join("")}</ol></div>
    <p><strong>Monsters:</strong> ${g.monsters.map(id=>esc(M[id].naam)).join(", ")}. <strong>Episch:</strong> ${esc(M[g.episch].naam)}.</p>
    <p class="story">Als hij ontwaakt: ${esc(g.ontwaken)}</p></article>`).join("");
}
const monsterCard=(m,ep)=>`<div class="card"><span class="kind">${ep?"Episch monster":"Monster"}</span><h3>${esc(m.naam)}</h3>
  <div class="nums"><span>Gruwel <b>${m.gruwel}</b></span><span>Taaiheid <b>${m.taaiheid}</b></span><span>Schade <b>${m.schade}</b></span><span>Leven <b>${m.leven}</b></span></div><p>${esc(m.eigenschap)}</p></div>`;
function lijst(items, kindKey, extra){
  const kinds=[...new Set(items.map(i=>i[kindKey]))];
  const shown=items.filter(i=>!sfilter||i[kindKey]===sfilter);
  return `<div class="filters"><button class="chip" data-sf="" aria-pressed="${!sfilter}">Alle (${items.length})</button>${kinds.map(k=>`<button class="chip" data-sf="${esc(k)}" aria-pressed="${sfilter===k}">${esc(k)}</button>`).join("")}</div>
    <div class="grid">${shown.map(extra).join("")}</div>`;
}
const VIEWS={
  bord:board,
  regels:()=>`<article class="rules">${md(D.regels)}</article>`,
  goden,
  monsters:()=>`<div class="grid">${D.epische.map(m=>monsterCard(m,1)).join("")}${D.monsters.map(m=>monsterCard(m)).join("")}</div>`,
  spreuken:()=>lijst(D.spreuken,"soort",s=>`<div class="card"><span class="kind">${esc(s.soort)}</span><h3>${esc(s.naam)}</h3><span class="cost">Test: ${esc(s.test)} (${s.moeilijkheid}) · prijs: ${esc(s.prijs)}</span><p>${esc(s.tekst)}</p></div>`),
  spullen:()=>lijst(D.spullen,"soort",s=>`<div class="card"><span class="kind">${esc(s.soort)}</span><h3>${esc(s.naam)}</h3><span class="cost">${s.prijs} Pond</span><p>${esc(s.tekst)}</p></div>`),
  artefacten:()=>`<div class="grid">${D.artefacten.map(a=>`<div class="card"><span class="kind">Artefact</span><h3>${esc(a.naam)}</h3><p class="story">${esc(a.herkomst)}</p><p>${esc(a.tekst)}</p></div>`).join("")}</div>`,
  toestanden:()=>lijst(D.toestanden,"soort",t=>`<div class="card"><span class="kind">${esc(t.soort)}</span><h3>${esc(t.naam)}</h3><p>${esc(t.tekst)}</p></div>`),
  onheil:()=>`<div class="grid">${D.onheil.map(o=>`<div class="card"><span class="kind">Onheil</span><h3>${esc(o.naam)}</h3><p class="story">${esc(o.tekst)}</p>
    <div class="nums">${o.mist?`<span>Mist <b>−${o.mist}</b></span>`:""}${o.scheur?`<span>Scheuren <b>+${o.scheur}</b></span>`:""}${o.monster?`<span>Monsters <b>+${o.monster}</b></span>`:""}</div>
    ${o.extra?`<p>${esc(o.extra)}</p>`:""}${o.gerucht?`<p><strong>Gerucht:</strong> ${esc(o.gerucht)}</p>`:""}</div>`).join("")}</div>`
};
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([id,l])=>`<button class="tab" role="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join("");
  document.getElementById("main").innerHTML=`<section class="panel">${VIEWS[tab]()}</section>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(t){tab=t.dataset.tab;sfilter=null;try{history.replaceState(null,"","#"+tab)}catch{} render();return;}
  const l=e.target.closest("[data-loc]"); if(l){sel=l.dataset.loc;render();return;}
  const f=e.target.closest("[data-sf]"); if(f){sfilter=f.dataset.sf||null;render();}
});
document.addEventListener("keydown",e=>{const l=e.target.closest?.("[data-loc]"); if(l&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sel=l.dataset.loc;render();document.querySelector(`[data-loc="${sel}"]`)?.focus();}});
addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)){tab=h;render();}});
render();
</script>
